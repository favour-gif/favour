<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/fullcalendar@5.11.3/main.min.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time Management App</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background-color: #000000;
            margin: 0;
            font-family: 'Poppins', sans-serif;
        }
        .container {
            text-align: center;
            max-width: 600px;
            background: #181818;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 8px 15px rgba(0, 0, 0, 0.3);
        }
        button {
            margin-top: 10px;
            background-color: #ffffff;
            color: rgb(0, 0, 0);
            border: none;
            padding: 10px 15px;
            width: 70%;
            border-radius: 8px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #b2b1af;
        }
        input[type="text"], input[type="date"] {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ccc;
            border-radius: 8px;
            background-color: #2e2e2e;
            color: white;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            background-color: #e3e3e3;
            margin-bottom: 10px;
            padding: 15px;
            border-radius: 8px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: background-color 0.3s ease;
        }
        .completed {
            background-color: #4CAF50 !important;
            color: white;
        }
        .task-details {
            flex: 1;
            text-align: left;
        }
        .delete {
            background-color: red;
            color: white;
            border: none;
            padding: 5px 10px;
            border-radius: 5px;
            cursor: pointer;
        }
        .analytics p, .calendar p {
            font-size: 1.1rem;
            margin: 10px 0;
            color: white;
        }
        h2 {
            color: white;
        }
    </style>
</head>
<body>
    <div class="container" id="mainPage">
        <h2>TEMPOTRACK</h2>
        <input type="text" id="task" placeholder="Enter task">
        <input type="date" id="deadline">
        <button onclick="addTask()">Add Task</button>
        <button onclick="showTasks()">View Tasks</button>
        <button onclick="showAnalytics()">Analytics</button>
        <button onclick="showCalendar()">Calendar View</button>
    </div>
    
    <div class="container" id="tasksPage" style="display: none;">
        <h2>SAVED TASKS</h2>
        <ul id="taskList"></ul>
        <button onclick="showMain()">Back</button>
    </div>

    <div class="container analytics" id="analyticsPage" style="display: none;">
        <h2>ANALYTICS</h2>
        <p>Total Tasks: <span id="totalTasks">0</span></p>
        <p>Completed Tasks: <span id="completedTasks">0</span></p>
        <p>Pending Tasks: <span id="pendingTasks">0</span></p>
        <p>Total Leisure Time: <span id="leisureTime">0</span> hours</p>
        <button onclick="showMain()">Back</button>
    </div>

    <div class="container calendar" id="calendarPage" style="display: none;">
        <h2>Calendar View</h2>
        <p>Upcoming Tasks:</p>
        <div id="calendar"></div>
        <button onclick="showMain()">Back</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
